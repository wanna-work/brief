  <li>структурирование и редактура предоставленной информации без добавления вымышленных фактов;</li>
  <li>дизайн и адаптация страницы для просмотра на компьютере и мобильном устройстве;</li>
  <li>размещение согласованных ссылок, кейсов, контактов и материалов;</li>
  <li>одна предварительная версия для проверки содержания, оформления и ссылок;</li>
  <li>один консолидированный раунд правок в рамках первоначально согласованного задания;</li>
  <li>публикация готовой версии после согласования и оплаты, а также хостинг на техническом адресе исполнителя сроком на 12 месяцев с даты публикации.</li>
</ul>
<p>Не входят, если отдельно не согласованы: дополнительные страницы, сложные интеграции, личный кабинет, интернет-магазин, программирование нестандартного функционала, покупка индивидуального домена на имя клиента, подписки и платные сторонние сервисы, постоянное сопровождение и неограниченные правки.</p>

<h2>4. Результат и адрес сайта</h2>
<p>Результат — опубликованная одностраничная версия сайта и ссылка на неё. Публикация выполняется на технической площадке и адресе, согласованных сторонами. Включённый хостинг действует 12 месяцев с даты публикации; это не означает передачу клиенту владения доменом, аккаунтом хостинга или инфраструктурой исполнителя. Индивидуальный домен, его регистрация и продление не включены, если стороны письменно не согласовали иное.</p>
<p>После истечения 12 месяцев стороны могут отдельно согласовать продление размещения или доступный способ переноса. Если продление не согласовано, исполнитель вправе прекратить размещение после предварительного уведомления клиента. Работа сторонних платформ и их постоянная доступность не контролируются исполнителем.</p>

<h2>5. Срок выполнения</h2>
<p>Ориентировочный срок — до 24 часов с момента, когда исполнитель получил заполненную анкету и все необходимые материалы, а также подтвердил заказ и его условия. Если для работы требуются уточнения, срок приостанавливается до получения ответа. Задержка предоставления материалов или согласования со стороны клиента соответственно сдвигает срок. При возникновении технических обстоятельств, влияющих на срок, исполнитель сообщает об этом клиенту и согласует дальнейшие действия.</p>

<h2>6. Предварительная версия и согласование</h2>
<p>Предварительная версия предназначена для проверки клиентом содержания, оформления и работоспособности ссылок. Клиенту следует сообщить замечания одним консолидированным списком в течение 3 календарных дней после получения ссылки. Если клиенту нужно больше времени, он сообщает об этом исполнителю, и стороны согласуют срок проверки.</p>
<p>Отсутствие ответа не считается автоматическим принятием работы. При отсутствии обратной связи выполнение заказа приостанавливается; срок дальнейшей работы согласуется отдельно. Предварительная версия не является разрешением публиковать, копировать, перепродавать или использовать её как готовый сайт до оплаты и завершения заказа.</p>

<h2>7. Правки и дополнительные работы</h2>
<p>В стоимость включён один раунд правок, соответствующих первоначальной анкете и согласованному заданию. В него входят уточнения текстов, замена предоставленных материалов и небольшие изменения оформления. Исправление ошибок, допущенных исполнителем относительно согласованного задания, не считается дополнительным раундом правок.</p>
<p>Новая концепция после согласования, изменение цели сайта, добавление страниц или функций, создание новых материалов и другие изменения объёма работ согласуются отдельно. Исполнитель заранее сообщает цену и срок; такие работы начинаются только после согласия клиента. Правки после публикации оплачиваются отдельно; ориентировочная стоимость — от 1 500 ₽ в зависимости от сложности, окончательная цена подтверждается до начала работ.</p>

<h2>8. Оплата</h2>
<p>Если стороны письменно не согласовали иное, оплата производится после проверки и согласования предварительной версии, но до публикации окончательной версии и предоставления клиенту итогового результата. Способ оплаты и реквизиты исполнитель сообщает клиенту отдельно. Исполнитель не начинает дополнительные платные работы без согласования их стоимости.</p>

<h2>9. Материалы клиента и права на использование</h2>
<p>Клиент отвечает за достоверность предоставленных сведений и подтверждает, что имеет право передавать исполнителю тексты, фотографии, логотипы, документы и другие материалы для выполнения заказа. Клиент не должен предоставлять конфиденциальные документы работодателей или клиентов, а также персональные данные третьих лиц без необходимых правовых оснований и разрешений.</p>
<p>После полной оплаты клиент вправе использовать созданный сайт для собственной профессиональной презентации и продвижения в согласованном виде. Передача исключительных прав, исходного кода, аккаунтов, домена или редактируемых исходников не входит в услугу, если это отдельно не согласовано письменно. Права на сторонние шрифты, изображения, библиотеки и сервисы регулируются лицензиями их правообладателей.</p>
<p>Исполнитель может показывать сайт или его фрагменты в собственном портфолио только при наличии отдельного разрешения клиента, если такое разрешение необходимо.</p>

<h2>10. Отказ от заказа, возврат и споры</h2>
<p>Если клиент отказывается от заказа до завершения работы, стороны производят расчёт с учётом фактически выполненной части работы и расходов исполнителя в соответствии с применимым законодательством.</p>
<p>После выполнения заказа в согласованном объёме и передачи результата клиенту изменение личных предпочтений, отказ от использования сайта или решение не публиковать его сами по себе не являются основанием для возврата оплаты.</p>
<p>Если клиент обнаружил недостатки результата, стороны действуют в соответствии с применимым законодательством. Исполнитель устраняет обоснованные недостатки, связанные с несоответствием согласованному заданию, в установленном законом порядке. Условия настоящего раздела не ограничивают обязательные права клиента.</p>
